site_name: Secure Software Factory
site_description: What a secure software factory actually is, what it can and cannot deliver, where the trade-offs are, and what the evidence says -- including where the evidence says we were wrong

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: amber
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - content.code.copy
    - content.tabs.link
  icon:
    logo: material/factory

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md

  - Getting Started:
    - start/index.md
    - The Problem: start/the-problem.md
    - What We Got Wrong: start/corrections.md
    - Scope -- What This Is Not: start/scope.md

  - How It Works:
    - how/index.md
    - The Five Primitives: how/primitives.md
    - The Hand-offs: how/handoffs.md
    - Slots and Outcomes: how/slots.md

  - A Worked Example:
    - example/index.md
    - A Change, End to End: example/connected.md
    - The Same Change, Air-Gapped: example/airgap.md

  - Trade-offs:
    - tradeoffs/index.md
    - Integrity vs Inspection: tradeoffs/integrity-vs-inspection.md
    - Gates vs Attention: tradeoffs/gates-vs-attention.md
    - Mandate vs Adoption: tradeoffs/mandate-vs-adoption.md
    - AI -- Capability vs Provability: tradeoffs/ai.md
    - Build vs Adopt: tradeoffs/build-vs-adopt.md

  - Limitations:
    - limits/index.md
    - What We Cannot Answer: limits/unanswerable.md
    - What Has Failed Before: limits/history.md
    - Ecosystem Health: limits/ecosystem.md

  - Reference:
    - Evidence Status: reference/status.md
    - Glossary: glossary.md
